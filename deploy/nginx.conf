# Front container for prototype.transportlab.app/parkeerdataviewer/.
# Nginx Proxy Manager forwards the path unchanged (no URI rewrite), so every
# location here carries the /parkeerdataviewer prefix.
#
#   /parkeerdataviewer/data/*  -> data volume (rewritten hourly by the worker)
#   everything else            -> Next.js app (app-parkeerdataviewer: pages, _next, /api/v1/*)

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types application/json application/geo+json text/plain text/css application/javascript;

# NPM overwrites X-Forwarded-For with its $remote_addr (the client) and sets X-Real-IP;
# pass the client IP as the only XFF entry so the app's rate limit sees the visitor.
map $http_x_real_ip $client_ip {
  ""      $remote_addr;
  default $http_x_real_ip;
}

server {
  listen 80;
  server_name _;

  # Data changes every hour: always revalidate. nginx answers conditional
  # requests with 304, so repeat visits stay cheap.
  location /parkeerdataviewer/data/ {
    alias /srv/parking/public/;
    types {
      application/geo+json geojson;
      application/json json;
    }
    add_header Cache-Control "public, no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Access-Control-Allow-Origin * always;
    # The worker's temp files (.name.tmp-PID) are never served.
    location ~ /\. { return 404; }
  }

  location /parkeerdataviewer {
    # Static container name (Coolify "consistent container names"), not the
    # service name: `web` is also on the shared coolify network, where a bare
    # `app` can resolve to another application's container.
    proxy_pass http://app-parkeerdataviewer:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Real-IP $client_ip;
  }

  # App root with a trailing slash: serve it instead of letting Next redirect
  # to /parkeerdataviewer. NPM custom locations end in "/" and redirect the
  # other way, so the two would loop.
  location = /parkeerdataviewer/ {
    rewrite ^ /parkeerdataviewer break;
    proxy_pass http://app-parkeerdataviewer:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Real-IP $client_ip;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
}
