# Coolify "Docker Compose" resource for prototype.transportlab.app/parkeerdataviewer.
# Settings in the Coolify UI (Environment Variables): GITHUB_TOKEN (feedback ->
# GitHub issues), optional GITHUB_REPO, NEXT_PUBLIC_UMAMI_SRC,
# NEXT_PUBLIC_UMAMI_WEBSITE_ID, NEXT_PUBLIC_THUNDERFOREST_API_KEY.
# Nginx Proxy Manager: proxy host prototype.transportlab.app, custom location
# /parkeerdataviewer -> http://parkeerdataviewer:80 on the shared `coolify`
# network (no URI rewrite). See deploy/README.md.
#
#   web     nginx: data files from the volume + proxy to app
#   app     Next.js server (UI, /api/v1/*)
#   worker  hourly RDW/NPR fetch + nightly history backup (deploy/scheduler.py)
services:
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.nginx
    restart: unless-stopped
    volumes:
      - parking-public:/srv/parking/public:ro
    expose:
      - "80"
    networks:
      default:
      coolify:
        aliases:
          - parkeerdataviewer
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    # worker first: it creates the volumes' directories with the right owner
    depends_on:
      - worker
      - app

  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        - NEXT_PUBLIC_BASE_PATH=/parkeerdataviewer
        - NEXT_PUBLIC_UMAMI_SRC=${NEXT_PUBLIC_UMAMI_SRC:-}
        - NEXT_PUBLIC_UMAMI_WEBSITE_ID=${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
        - NEXT_PUBLIC_THUNDERFOREST_API_KEY=${NEXT_PUBLIC_THUNDERFOREST_API_KEY:-}
    restart: unless-stopped
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_REPO=${GITHUB_REPO:-robbertj85/parkeerdataviewer}
    volumes:
      - parking-public:/srv/parking/public:ro
      # Read-write mount, but the app opens history.db read-only (WAL needs the -shm file)
      - parking-state:/srv/parking/state
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/parkeerdataviewer').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - worker

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.worker
    restart: unless-stopped
    init: true
    volumes:
      - parking-public:/srv/parking/public
      - parking-state:/srv/parking/state
      - parking-cache:/srv/parking/cache
    mem_limit: 1g

volumes:
  parking-public:  # web-served: latest.json, parking_facilities.geojson, summary.json, municipalities/
  parking-state:   # history.db + backups/  <- irreplaceable, back this up
  parking-cache:   # RDW index/static + geocode caches (safe to delete)

networks:
  coolify:
    external: true
